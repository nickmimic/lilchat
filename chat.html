<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sidebar-w: 240px;
  --bg: #f0efed;
  --surface: #fafaf9;
  --surface2: #f4f3f1;
  --border: #e4e3e0;
  --border-strong: #cccac6;
  --text: #181817;
  --text-2: #6b6a67;
  --text-3: #aaa9a6;
  --accent: #2563eb;
  --accent-dim: #dbeafe;
  --user-bg: #181817;
  --user-text: #f0efed;
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111110;
    --surface: #1a1a19;
    --surface2: #222221;
    --border: #2c2c2a;
    --border-strong: #3e3e3b;
    --text: #ebebea;
    --text-2: #9a9996;
    --text-3: #5a5a57;
    --accent: #3b82f6;
    --accent-dim: #1e3a5f;
    --user-bg: #ebebea;
    --user-text: #111110;
    --danger: #f87171;
    --danger-bg: #2d1515;
  }
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  overflow: hidden;
  font-size: 15px;
  line-height: 1.6;
}

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.2s, min-width 0.2s;
}

#sidebar.collapsed {
  width: 48px;
  min-width: 48px;
}

#sidebar-top {
  padding: 12px 10px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#sidebar-toggle {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 16px;
  transition: background 0.12s;
}
#sidebar-toggle:hover { background: var(--surface2); }

#new-chat-btn {
  flex: 1;
  text-align: left;
  padding: 5px 8px;
  border-radius: 7px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  transition: background 0.12s;
}
#new-chat-btn:hover { background: var(--surface2); }

.sidebar-collapsed #new-chat-btn,
#sidebar.collapsed #new-chat-btn { display: none; }

#chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 6px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

#chat-list::-webkit-scrollbar { width: 4px; }
#chat-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.chat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: 8px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.1s;
  min-width: 0;
}
.chat-item:hover { background: var(--surface2); }
.chat-item.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.chat-item-icon {
  font-size: 13px;
  flex-shrink: 0;
  opacity: 0.6;
}

.chat-item-label {
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

#sidebar.collapsed .chat-item-label { display: none; }

.chat-item-del {
  width: 18px; height: 18px;
  border-radius: 4px;
  border: none;
  background: transparent;
  color: var(--text-3);
  cursor: pointer;
  font-size: 12px;
  display: none;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.chat-item:hover .chat-item-del { display: flex; }
.chat-item-del:hover { color: var(--danger); }
#sidebar.collapsed .chat-item-del { display: none !important; }

.sidebar-section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  padding: 8px 8px 4px;
  letter-spacing: 0.04em;
}
#sidebar.collapsed .sidebar-section-label { display: none; }

#sidebar-bottom {
  padding: 8px 6px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

#settings-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  text-align: left;
  transition: background 0.12s;
}
#settings-btn:hover { background: var(--surface2); color: var(--text); }
#settings-btn svg { flex-shrink: 0; }
#sidebar.collapsed #settings-btn span { display: none; }

/* ── Main area ── */
#main {
  flex: 1;
  display: grid;
  grid-template-rows: 1fr auto;
  overflow: hidden;
  min-width: 0;
}

/* ── Messages ── */
#messages {
  overflow-y: auto;
  padding: 28px 0 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.msg-row { display: flex; padding: 0 20px; }
.msg-row.user { justify-content: flex-end; }
.msg-row.assistant { justify-content: flex-start; }

.bubble {
  max-width: min(680px, 82%);
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.65;
  word-break: break-word;
}

.msg-row.user .bubble {
  background: var(--user-bg);
  color: var(--user-text);
  border-bottom-right-radius: 4px;
}

.msg-row.assistant .bubble {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

.msg-row.sysmsg .bubble {
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 8px;
  font-size: 13px;
  padding: 7px 12px;
}

.msg-row.errmsg .bubble {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 8px;
  font-size: 13px;
  padding: 7px 12px;
}

/* markdown */
.bubble p { margin-bottom: 0.55em; }
.bubble p:last-child { margin-bottom: 0; }
.bubble strong { font-weight: 600; }
.bubble em { font-style: italic; }
.bubble code {
  font-family: var(--mono);
  font-size: 0.87em;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
}
.bubble pre {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  margin: 0.6em 0;
  font-family: var(--mono);
  font-size: 0.84em;
  line-height: 1.5;
}
.bubble pre code { background: none; border: none; padding: 0; }
.bubble ul, .bubble ol { padding-left: 1.3em; margin-bottom: 0.5em; }
.bubble li { margin-bottom: 0.15em; }
.bubble h1, .bubble h2, .bubble h3 { font-weight: 600; margin: 0.7em 0 0.25em; line-height: 1.3; }
.bubble h1 { font-size: 1.12em; }
.bubble h2 { font-size: 1.04em; }
.bubble h3 { font-size: 0.98em; }
.bubble blockquote { border-left: 3px solid var(--border-strong); padding-left: 12px; color: var(--text-2); margin: 0.5em 0; }
.bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }

/* sources */
.sources { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.source-chip {
  font-size: 11px; font-weight: 500;
  color: var(--text-2);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 7px;
  text-decoration: none;
  white-space: nowrap;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: border-color 0.12s;
}
.source-chip:hover { border-color: var(--accent); color: var(--accent); }

/* typing */
.typing .bubble { display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-5px);opacity:1} }

/* empty state */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--text-3);
  text-align: center;
  padding: 40px;
  pointer-events: none;
}
#empty-state svg { opacity: 0.25; }
#empty-state p { font-size: 14px; }

/* ── Input area ── */
#input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#search-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.toggle-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
}
.toggle-label input[type="checkbox"] {
  accent-color: var(--accent);
  width: 14px; height: 14px;
  cursor: pointer;
}

#search-status {
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-left: auto;
}
#search-status.active { color: var(--accent); }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#user-input {
  flex: 1;
  resize: none;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 15px;
  font-family: var(--font);
  min-height: 44px;
  max-height: 200px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border-strong);
  color: var(--text);
  outline: none;
  line-height: 1.5;
}
#user-input:focus { border-color: var(--accent); }

#send-btn {
  height: 44px; width: 44px;
  border-radius: 10px;
  border: none;
  background: var(--user-bg);
  color: var(--user-text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.12s;
}
#send-btn:hover { opacity: 0.8; }
#send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── Settings modal ── */
#settings-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
#settings-overlay.open { display: flex; }

#settings-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: min(520px, calc(100vw - 40px));
  max-height: calc(100dvh - 80px);
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
}
#close-settings {
  width: 28px; height: 28px;
  border-radius: 7px;
  border: none;
  background: var(--surface2);
  color: var(--text-2);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
#close-settings:hover { color: var(--text); }

.field-group {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
}

.field input, .field select, .field textarea {
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  padding: 8px 10px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field select { cursor: pointer; }
.field textarea { resize: vertical; min-height: 80px; max-height: 180px; line-height: 1.5; }

.field-hint { font-size: 12px; color: var(--text-3); }

.modal-section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.save-btn {
  padding: 9px 20px;
  border-radius: 8px;
  border: none;
  background: var(--user-bg);
  color: var(--user-text);
  font-size: 14px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  align-self: flex-end;
  transition: opacity 0.12s;
}
.save-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div id="sidebar-top">
    <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
    <button id="new-chat-btn">+ New chat</button>
  </div>
  <div id="chat-list"></div>
  <div id="sidebar-bottom">
    <button id="settings-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Settings</span>
    </button>
  </div>
</div>

<!-- ── Main ── -->
<div id="main">
  <div id="messages">
    <div id="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>New chat. Start typing below.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="search-row">
      <label class="toggle-label">
        <input type="checkbox" id="search-toggle"> Web search
      </label>
      <div id="search-status"></div>
    </div>
    <div class="input-row">
      <textarea id="user-input" placeholder="Message…" rows="1" autofocus></textarea>
      <button id="send-btn" title="Send (Enter)">↑</button>
    </div>
  </div>
</div>

<!-- ── Settings modal ── -->
<div id="settings-overlay">
  <div id="settings-modal">
    <div class="modal-header">
      <span class="modal-title">Settings</span>
      <button id="close-settings">✕</button>
    </div>

    <div class="field-group">
      <div class="modal-section-title">Provider</div>

      <div class="field">
        <label class="field-label">Provider</label>
        <select id="s-provider">
          <option value="claude">Claude (Anthropic)</option>
          <option value="openai">OpenAI</option>
          <option value="lan">Custom / LAN</option>
        </select>
      </div>

      <div class="field" id="s-model-field">
        <label class="field-label">Model</label>
        <input type="text" id="s-model" placeholder="model name">
        <span class="field-hint">e.g. claude-sonnet-4-6, gpt-4o, or full local path</span>
      </div>

      <div class="field" id="s-apikey-field">
        <label class="field-label">API Key</label>
        <input type="password" id="s-apikey" placeholder="sk-…">
      </div>

      <div class="field" id="s-baseurl-field" style="display:none">
        <label class="field-label">Base URL</label>
        <input type="text" id="s-baseurl" placeholder="http://192.168.1.x:8086">
        <span class="field-hint">The full URL to your local server</span>
      </div>
    </div>

    <div class="field-group">
      <div class="modal-section-title">Search</div>
      <div class="field">
        <label class="field-label">SearXNG URL</label>
        <input type="text" id="s-searxng" placeholder="http://192.168.1.x:8080" value="">
        <span class="field-hint">Your SearXNG instance. Leave blank to disable search.</span>
      </div>
    </div>

    <div class="field-group">
      <div class="modal-section-title">System Prompt</div>
      <div class="field">
        <textarea id="s-sysprompt" placeholder="Optional system prompt…"></textarea>
      </div>
    </div>

    <button class="save-btn" id="save-settings">Save settings</button>
  </div>
</div>

<script>
// ── Storage keys ──────────────────────────────────────────────────────────
const SETTINGS_KEY = 'chat_settings';
const CHATS_KEY    = 'chat_history';

// ── State ─────────────────────────────────────────────────────────────────
const APP_HOST = window.location.host;
let settings = {
  provider: 'lan',
  model: '',
  apiKey: '',
  baseUrl: `http://${APP_HOST}`,
  searxngUrl: `http://${APP_HOST}`,
  systemPrompt: '',
};

let chats = {};       // { id: { title, messages: [{role,content}] } }
let activeChatId = null;
let isStreaming = false;

// ── Helpers ───────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function saveSettings() {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}
function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    if (s) settings = { ...settings, ...s };
  } catch {}
}

function saveChats() {
  localStorage.setItem(CHATS_KEY, JSON.stringify(chats));
}
function loadChats() {
  try {
    const c = JSON.parse(localStorage.getItem(CHATS_KEY));
    if (c) chats = c;
  } catch {}
}

function scrollBottom() {
  const m = $('messages');
  m.scrollTo({ top: m.scrollHeight, behavior: 'smooth' });
}

function setSearchStatus(text) {
  const el = $('search-status');
  if (!text) { el.innerHTML = ''; el.className = ''; return; }
  el.innerHTML = `<span class="sdot"></span>${text}`;
  el.className = 'active';
}

// ── Markdown renderer ─────────────────────────────────────────────────────
function md(text) {
  let h = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${c.trimEnd()}</code></pre>`)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^## (.+)$/gm,'<h2>$1</h2>')
    .replace(/^# (.+)$/gm,'<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>')
    .replace(/^[\-\*] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/^---+$/gm,'<hr>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');
  h = h.replace(/(<li>[\s\S]*?<\/li>)+/g, m => `<ul>${m}</ul>`);
  if (!h.startsWith('<')) h = `<p>${h}</p>`;
  return h;
}

// ── Chat list sidebar ─────────────────────────────────────────────────────
function renderChatList() {
  const list = $('chat-list');
  list.innerHTML = '';

  const ids = Object.keys(chats).sort((a, b) => b.localeCompare(a));
  if (ids.length === 0) return;

  const todayIds = [], olderIds = [];
  const dayMs = 86400000;
  const now = Date.now();
  ids.forEach(id => {
    const ts = parseInt(id, 36);
    (now - ts < dayMs ? todayIds : olderIds).push(id);
  });

  function addSection(label, sectionIds) {
    if (!sectionIds.length) return;
    const lbl = document.createElement('div');
    lbl.className = 'sidebar-section-label';
    lbl.textContent = label;
    list.appendChild(lbl);
    sectionIds.forEach(id => {
      const chat = chats[id];
      const item = document.createElement('div');
      item.className = 'chat-item' + (id === activeChatId ? ' active' : '');
      item.dataset.id = id;
      item.innerHTML = `
        <span class="chat-item-icon">💬</span>
        <span class="chat-item-label">${escHtml(chat.title || 'Untitled')}</span>
        <button class="chat-item-del" title="Delete">✕</button>
      `;
      item.addEventListener('click', e => {
        if (e.target.classList.contains('chat-item-del')) {
          deleteChat(id);
        } else {
          switchChat(id);
        }
      });
      list.appendChild(item);
    });
  }

  addSection('Today', todayIds);
  addSection('Earlier', olderIds);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function switchChat(id) {
  activeChatId = id;
  renderChatList();
  renderMessages();
}

function deleteChat(id) {
  delete chats[id];
  saveChats();
  if (activeChatId === id) {
    activeChatId = null;
    clearMessages();
  }
  renderChatList();
}

function newChat() {
  activeChatId = null;
  clearMessages();
  renderChatList();
  $('user-input').focus();
}

function clearMessages() {
  $('messages').innerHTML = `
    <div id="empty-state">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>New chat. Start typing below.</p>
    </div>`;
}

function renderMessages() {
  const msgs = $('messages');
  msgs.innerHTML = '';
  if (!activeChatId || !chats[activeChatId]) { clearMessages(); return; }
  const chat = chats[activeChatId];
  if (!chat.messages.length) { clearMessages(); return; }
  chat.messages.forEach(m => {
    appendBubble(m.role, m.content, m.sources || []);
  });
  scrollBottom();
}

// ── Bubble rendering ──────────────────────────────────────────────────────
function removeEmpty() {
  const e = $('empty-state');
  if (e) e.remove();
}

function appendBubble(role, content, sources = []) {
  removeEmpty();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'assistant') {
    bubble.innerHTML = md(content);
    if (sources.length) appendSources(bubble, sources);
  } else if (role === 'user') {
    bubble.textContent = content;
  } else {
    bubble.textContent = content;
  }

  row.appendChild(bubble);
  $('messages').appendChild(row);
  scrollBottom();
  return bubble;
}

function appendSources(bubble, sources) {
  const s = document.createElement('div');
  s.className = 'sources';
  sources.forEach(src => {
    const a = document.createElement('a');
    a.className = 'source-chip';
    a.href = src.url; a.target = '_blank'; a.rel = 'noopener';
    try { a.textContent = new URL(src.url).hostname; }
    catch { a.textContent = src.url; }
    a.title = src.title || src.url;
    s.appendChild(a);
  });
  bubble.appendChild(s);
}

function showTyping() {
  removeEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row assistant typing';
  row.id = 'typing-ind';
  row.innerHTML = '<div class="bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  $('messages').appendChild(row);
  scrollBottom();
}
function hideTyping() { const t = $('typing-ind'); if (t) t.remove(); }

function appendStatus(text, isError) {
  const row = document.createElement('div');
  row.className = `msg-row ${isError ? 'errmsg' : 'sysmsg'}`;
  row.innerHTML = `<div class="bubble">${escHtml(text)}</div>`;
  $('messages').appendChild(row);
  scrollBottom();
}

// ── URL detection ─────────────────────────────────────────────────────────
function extractUrl(text) {
  const m = text.match(/https?:\/\/[^\s]+/);
  return m ? m[0] : null;
}

// ── URL fetch via proxy ───────────────────────────────────────────────────
async function fetchUrl(url) {
  // Route through the searxng proxy origin so CORS is not an issue
  // We use a simple fetch-relay endpoint on the proxy
  const relay = `${settings.searxngUrl.replace(/\/search.*$/, '')}/fetch?url=${encodeURIComponent(url)}`;
  try {
    const resp = await fetch(relay);
    if (resp.ok) {
      const text = await resp.text();
      if (text && text.length > 100) return text;
    }
  } catch {}
  // Fallback: try fetching directly (works if CORS is open)
  try {
    const resp = await fetch(url);
    if (resp.ok) {
      const html = await resp.text();
      return stripHtml(html);
    }
  } catch {}
  return null;
}

function stripHtml(html) {
  // Remove scripts, styles, nav, footer
  html = html.replace(/<script[\s\S]*?<\/script>/gi, '');
  html = html.replace(/<style[\s\S]*?<\/style>/gi, '');
  html = html.replace(/<nav[\s\S]*?<\/nav>/gi, '');
  html = html.replace(/<footer[\s\S]*?<\/footer>/gi, '');
  html = html.replace(/<header[\s\S]*?<\/header>/gi, '');
  // Strip tags
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  const text = (tmp.textContent || tmp.innerText || '').replace(/\s+/g, ' ').trim();
  return text.slice(0, 6000);
}

function buildFetchCtx(url, content, query) {
  return `The user asked: "${query}"\n\nHere is the content of the page at ${url}:\n\n${content}\n\nAnswer based on the page content above. Be concise. /no_think`;
}

// ── SearXNG ───────────────────────────────────────────────────────────────
async function searxSearch(query) {
  const url = `${settings.searxngUrl}/search?q=${encodeURIComponent(query)}&format=json`;
  let resp;
  try {
    resp = await fetch(url);
  } catch (e) {
    console.warn('Search backend unreachable:', e.message);
    throw new Error('search backend not reachable (is SearXNG running?)');
  }
  if (!resp.ok) {
    const body = await resp.text().catch(() => '');
    let hint = body || `HTTP ${resp.status}`;
    try { hint = JSON.parse(body).error || hint; } catch {}
    console.warn('SearXNG error:', resp.status, hint);
    throw new Error(`search backend: ${hint}`);
  }
  const data = await resp.json();
  return (data.results || []).slice(0, 3).map(r => ({
    title: r.title, url: r.url, content: (r.content || '').slice(0, 280)
  }));
}

function buildSearchCtx(query, results) {
  const items = results.map((r, i) =>
    `[${i+1}] ${r.title}\nURL: ${r.url}\n${r.content}`
  ).join('\n\n');
  return `The user asked: "${query}"\n\nWeb search results:\n\n${items}\n\nAnswer in at most 8 sentences. Cite as [1] [2]. /no_think`;
}

// ── API calls ─────────────────────────────────────────────────────────────
async function callClaude(messages, onChunk) {
  const body = { model: settings.model, max_tokens: 8192, messages, stream: true };
  if (settings.systemPrompt) body.system = settings.systemPrompt;
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${resp.status}`); }
  await streamSSE(resp, onChunk, evt => evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta' ? evt.delta.text : null);
}

async function callOpenAICompat(messages, onChunk, baseUrl) {
  const sysMsg = settings.systemPrompt ? [{ role: 'system', content: settings.systemPrompt }] : [];
  const searchOn = $('search-toggle') && $('search-toggle').checked;
  const body = {
    model: settings.model,
    messages: [...sysMsg, ...messages],
    stream: true,
    max_tokens: searchOn ? 512 : 1024,
    temperature: 0.7,
    top_p: 0.8,
    chat_template_kwargs: { enable_thinking: false },
  };
  const headers = { 'Content-Type': 'application/json' };
  if (settings.apiKey) headers['Authorization'] = `Bearer ${settings.apiKey}`;
  const resp = await fetch(`${baseUrl}/v1/chat/completions`, { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) { const e = await resp.text(); throw new Error(`HTTP ${resp.status}: ${e.slice(0,200)}`); }
  await streamSSE(resp, onChunk, evt => evt.choices?.[0]?.delta?.content || null);
}

async function streamSSE(resp, onChunk, extract) {
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6).trim();
      if (data === '[DONE]') return;
      try { const chunk = extract(JSON.parse(data)); if (chunk) onChunk(chunk); } catch {}
    }
  }
}

// ── Send ──────────────────────────────────────────────────────────────────
async function send() {
  if (isStreaming) return;
  const input = $('user-input');
  const text = input.value.trim();
  if (!text) return;

  // validate
  if (settings.provider === 'claude' && !settings.apiKey)
    return appendStatus('Add your Anthropic API key in Settings.', true);
  if (settings.provider === 'openai' && !settings.apiKey)
    return appendStatus('Add your OpenAI API key in Settings.', true);
  if (settings.provider === 'lan' && !settings.baseUrl)
    return appendStatus('Add your Base URL in Settings.', true);

  input.value = '';
  autoResize();
  isStreaming = true;
  $('send-btn').disabled = true;

  // create or get chat
  if (!activeChatId) {
    activeChatId = genId();
    chats[activeChatId] = {
      title: text.slice(0, 48) + (text.length > 48 ? '…' : ''),
      messages: [],
    };
    renderChatList();
  }

  const chat = chats[activeChatId];
  chat.messages.push({ role: 'user', content: text });
  appendBubble('user', text);

  // search / fetch
  let sources = [];
  let apiContent = text;
  const searchOn = $('search-toggle').checked && settings.searxngUrl;
  const detectedUrl = extractUrl(text);

  if (detectedUrl) {
    // URL present → always try to fetch it, regardless of search toggle
    setSearchStatus('Fetching page…');
    try {
      const pageText = await fetchUrl(detectedUrl);
      if (pageText && pageText.length > 50) {
        apiContent = buildFetchCtx(detectedUrl, pageText, text);
        sources = [{ url: detectedUrl, title: detectedUrl }];
        setSearchStatus('Page fetched');
      } else if (searchOn) {
        // Fetch returned too little — fall back to web search if enabled
        setSearchStatus('Searching…');
        const results = await searxSearch(text);
        sources = results;
        if (results.length) {
          apiContent = buildSearchCtx(text, results);
          setSearchStatus(`${results.length} results`);
        } else {
          setSearchStatus('No results');
        }
      } else {
        setSearchStatus('Fetch failed (short response)');
      }
    } catch (err) {
      setSearchStatus('Fetch failed');
    }
    setTimeout(() => setSearchStatus(''), 3000);
  } else if (searchOn) {
    // No URL, search on → web search
    setSearchStatus(`Searching…`);
    try {
      const results = await searxSearch(text);
      sources = results;
      if (results.length) {
        apiContent = buildSearchCtx(text, results);
        setSearchStatus(`${results.length} results`);
      } else {
        setSearchStatus('No results');
      }
    } catch (err) {
      setSearchStatus('Search failed');
    }
    setTimeout(() => setSearchStatus(''), 3000);
  }

  // build API history
  const apiMsgs = chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
  apiMsgs.push({ role: 'user', content: apiContent });

  showTyping();
  let full = '';
  let bubble = null;

  try {
    const onChunk = chunk => {
      if (!bubble) { hideTyping(); bubble = appendBubble('assistant', ''); }
      full += chunk;
      bubble.innerHTML = md(full);
      if (sources.length && !bubble.querySelector('.sources')) appendSources(bubble, sources);
      scrollBottom();
    };

    if (settings.provider === 'claude') await callClaude(apiMsgs, onChunk);
    else if (settings.provider === 'openai') await callOpenAICompat(apiMsgs, onChunk, 'https://api.openai.com');
    else await callOpenAICompat(apiMsgs, onChunk, settings.baseUrl);

    hideTyping();
    chat.messages.push({ role: 'assistant', content: full, sources });
    saveChats();

  } catch (err) {
    hideTyping();
    appendStatus('Error: ' + err.message, true);
    chat.messages.pop(); // remove failed user message
    saveChats();
  }

  isStreaming = false;
  $('send-btn').disabled = false;
  input.focus();
}

// ── Settings modal ────────────────────────────────────────────────────────
function openSettings() {
  $('s-provider').value  = settings.provider;
  $('s-model').value     = settings.model;
  $('s-apikey').value    = settings.apiKey;
  $('s-baseurl').value   = settings.baseUrl;
  $('s-searxng').value   = settings.searxngUrl;
  $('s-sysprompt').value = settings.systemPrompt;
  updateProviderFields();
  $('settings-overlay').classList.add('open');
}

function closeSettings() {
  $('settings-overlay').classList.remove('open');
}

function updateProviderFields() {
  const v = $('s-provider').value;
  $('s-apikey-field').style.display = v === 'lan' ? 'none' : 'flex';
  $('s-baseurl-field').style.display = v === 'lan' ? 'flex' : 'none';
  const hints = { claude: 'claude-sonnet-4-6', openai: 'gpt-4o', lan: '/full/path/to/model or model-name' };
  $('s-model').placeholder = hints[v] || 'model name';
}

$('s-provider').addEventListener('change', updateProviderFields);

$('save-settings').addEventListener('click', () => {
  settings.provider     = $('s-provider').value;
  settings.model        = $('s-model').value.trim();
  settings.apiKey       = $('s-apikey').value.trim();
  settings.baseUrl      = $('s-baseurl').value.trim().replace(/\/$/, '');
  settings.searxngUrl   = $('s-searxng').value.trim().replace(/\/$/, '');
  settings.systemPrompt = $('s-sysprompt').value.trim();
  saveSettings();
  closeSettings();
});

$('settings-btn').addEventListener('click', openSettings);
$('close-settings').addEventListener('click', closeSettings);
$('settings-overlay').addEventListener('click', e => { if (e.target === $('settings-overlay')) closeSettings(); });

// ── Sidebar ───────────────────────────────────────────────────────────────
$('sidebar-toggle').addEventListener('click', () => {
  $('sidebar').classList.toggle('collapsed');
});
$('new-chat-btn').addEventListener('click', newChat);

// ── Input ─────────────────────────────────────────────────────────────────
function autoResize() {
  const t = $('user-input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 200) + 'px';
}
$('user-input').addEventListener('input', autoResize);
$('user-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('send-btn').addEventListener('click', send);

// ── Init ──────────────────────────────────────────────────────────────────
loadSettings();
loadChats();
renderChatList();

// open settings automatically if nothing is configured
if (!settings.model) {
  openSettings();
}
</script>
